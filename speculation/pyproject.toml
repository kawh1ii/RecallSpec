[project]
name = "recallspec"
version = "0.1.0"
description = "Bounded cross-request speculative draft retrieval with verified feedback"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
engine = ["vllm==0.32.0"]

[tool.setuptools.packages.find]
where = ["src"]
